services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-facevalue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facevalue}
      POSTGRES_DB: ${POSTGRES_DB:-facevalue}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-facevalue}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin} &&
      mc mb -p local/${S3_BUCKET:-face-value-images-dev} &&
      exit 0
      "

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      PORT: ${PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://facevalue:facevalue@postgres:5432/facevalue?sslmode=disable}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      COOKIE_SIGNING_SECRET: ${COOKIE_SIGNING_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAGIC_LINK_FROM_EMAIL: ${MAGIC_LINK_FROM_EMAIL:-login@facevalue.local}
      HF_TOKEN: ${HF_TOKEN}
      HF_VISION_MODEL: ${HF_VISION_MODEL:-Qwen/Qwen2.5-VL-72B-Instruct}
      HF_API_BASE: ${HF_API_BASE:-https://router.huggingface.co/v1}
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET}
      EBAY_API_BASE: ${EBAY_API_BASE:-https://api.sandbox.ebay.com}
      EBAY_MARKETPLACE_ID: ${EBAY_MARKETPLACE_ID:-EBAY_US}
      EBAY_COMP_LIMIT: ${EBAY_COMP_LIMIT:-50}
      PRICE_SOURCE: ${PRICE_SOURCE:-ebay_browse}
      S3_BUCKET: ${S3_BUCKET:-face-value-images-dev}
      S3_REGION: ${S3_REGION:-us-west-2}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PRESIGN_TTL: ${S3_PRESIGN_TTL:-15m}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_CONCURRENT_APPRAISALS: ${MAX_CONCURRENT_APPRAISALS:-4}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8080}
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
